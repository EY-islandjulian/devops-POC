name: ARTIFACTS Promote and Deploy CMA
on:
 workflow_dispatch:
   inputs:
     release_tag:
       description: "Release tag (v1.0.0-FOLDER)"
       required: true
       type: string
     target_env:
       description: "Target environment"
       required: true
       type: choice
       options:
         - C2MTEST
permissions:
 contents: write
 pull-requests: write
 actions: read
jobs:
 promote-pr:
   runs-on: ubuntu-latest
   outputs:
     TEMP_BRANCH: ${{ steps.create_branch.outputs.TEMP_BRANCH }}
     TARGET_ENV: ${{ steps.resolve.outputs.TARGET_ENV }}
     CMA_FOLDER: ${{ steps.extract.outputs.CMA_FOLDER }}
   steps:
     - uses: actions/checkout@v4
       with:
         fetch-depth: 0
     - name: Extract CMA folder
       id: extract
       shell: pwsh
       run: |
         $parts="${{ inputs.release_tag }}".Split("-",2)
         if ($parts.Length -lt 2){ throw "Invalid tag format" }
         $folder=$parts[1]
         "CMA_FOLDER=$folder" | Out-File $env:GITHUB_ENV -Append
         "CMA_FOLDER=$folder" | Out-File $env:GITHUB_OUTPUT -Append
     - name: Resolve target
       id: resolve
       shell: pwsh
       run: |
         $target="${{ inputs.target_env }}"
         switch ($target) {
           "C2MTEST" { $source="C2MDEV" }
           default { throw "Invalid promotion target" }
         }
         "SOURCE_BRANCH=$source" | Out-File $env:GITHUB_ENV -Append
         "TARGET_ENV=$target" | Out-File $env:GITHUB_OUTPUT -Append
     - name: Prepare CMA ZIP
       id: prepare
       shell: pwsh
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         $tag="${{ inputs.release_tag }}"
         $folder="${{ steps.extract.outputs.CMA_FOLDER }}"
         $releaseExists = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
         if (-not $releaseExists) {
             Write-Host "Release $tag not found. Creating initial release from source branch..."
             git fetch origin ${{ steps.resolve.outputs.SOURCE_BRANCH }}
             git checkout origin/${{ steps.resolve.outputs.SOURCE_BRANCH }} -- $folder
             $zip="$folder-$tag.zip"
             Compress-Archive "$folder/*" $zip -Force
             gh release create $tag $zip --title "$tag" --notes "Initial deployment for CMA $folder ($tag)" --repo $env:GITHUB_REPOSITORY
         } else {
             Write-Host "Release $tag exists. Downloading CMA ZIP from release assets..."
             gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "*.zip" --dir "./"
         }
         $zipFile = Get-ChildItem *.zip | Where-Object { $_.Name -like "*$folder*" } | Select-Object -First 1
         if (-not $zipFile) { throw "CMA ZIP not found in release assets." }
         "CMA_ZIP=$($zipFile.Name)" | Out-File $env:GITHUB_ENV -Append
         "CMA_ZIP=$($zipFile.Name)" | Out-File $env:GITHUB_OUTPUT -Append
     - name: Upload CMA ZIP as artifact
       uses: actions/upload-artifact@v4
       with:
         name: cma-zip
         path: ${{ steps.prepare.outputs.CMA_ZIP }}
     - name: Create temp branch with CMA ZIP
       id: create_branch
       shell: pwsh
       run: |
         $target="${{ steps.resolve.outputs.TARGET_ENV }}"
         $folder="${{ steps.extract.outputs.CMA_FOLDER }}"
         $tag="${{ inputs.release_tag }}"
         $zip="${{ steps.prepare.outputs.CMA_ZIP }}"
         $tempBranch="promote-$folder-$tag"
         Write-Host "Fetching target branch $target..."
         git fetch origin $target
         git checkout -b $tempBranch origin/$target
         $deployDir="deployments/$target"
         if (-not (Test-Path $deployDir)) { New-Item -ItemType Directory -Path $deployDir | Out-Null }
         Copy-Item $zip $deployDir/
         git add $deployDir/$zip
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git commit -m "Promote CMA $folder ($tag) to $target" --allow-empty
         git push origin HEAD --force
         "TEMP_BRANCH=$tempBranch" | Out-File $env:GITHUB_OUTPUT -Append
     - name: Create PR from temp branch
       shell: pwsh
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         $branch="${{ steps.create_branch.outputs.TEMP_BRANCH }}"
         $target="${{ steps.resolve.outputs.TARGET_ENV }}"
         $folder="${{ steps.extract.outputs.CMA_FOLDER }}"
         $tag="${{ inputs.release_tag }}"
         $title="Promote CMA folder $folder ($tag) to $target"
         $body="Promotion request for CMA folder $folder from tag $tag.`nRollback: revert merge commit or redeploy previous release."
         Write-Host "Creating PR from $branch to $target..."
         gh pr create --base "$target" --head "$branch" --title "$title" --body "$body"
 promote-and-upload:
   needs: promote-pr
   runs-on: ubuntu-latest
   outputs:
     TARGET_ENV: ${{ needs.promote-pr.outputs.TARGET_ENV }}
     CMA_FOLDER: ${{ needs.promote-pr.outputs.CMA_FOLDER }}
   steps:
     - uses: actions/checkout@v4
       with:
         ref: ${{ needs.promote-pr.outputs.TARGET_ENV }}
         fetch-depth: 0
     - name: Download CMA ZIP artifact
       uses: actions/download-artifact@v3
       with:
         name: cma-zip
         path: ./  # downloads to current directory
     - name: Tag and Release
       shell: pwsh
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         $tag="${{ inputs.release_tag }}"
         $zip = Get-ChildItem *.zip | Select-Object -First 1
         git fetch origin --tags
         $target="${{ needs.promote-pr.outputs.TARGET_ENV }}"
         if ($target -eq "C2MTEST" -or $target -eq "C2MUAT") {
             if (-not (git tag -l "$tag")) {
                 git tag $tag
                 git push origin $tag
             }
         }
         $releaseExists = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
         if (-not $releaseExists) {
             gh release create $tag $zip --title "$tag" --notes "Automated release for CMA $tag" --repo $env:GITHUB_REPOSITORY
         } else {
             gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
         }
